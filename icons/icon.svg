<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1322"/>
      <stop offset="100%" stop-color="#04060a"/>
    </linearGradient>

    <!-- PAudio Signature Gradient (Neon Emerald to Electric Cyan) -->
    <linearGradient id="pAudioGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="60%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>

    <!-- Vinyl Disc Gradient -->
    <radialGradient id="discGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="70%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>

    <!-- Glow Filter -->
    <filter id="pGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Container Box -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="510" height="510" x="1" y="1" rx="111" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>

  <!-- Ambient Backdrop Glow -->
  <circle cx="280" cy="205" r="140" fill="url(#pAudioGrad)" opacity="0.18" filter="url(#pGlow)"/>

  <!-- Vinyl Disc Background inside P-loop -->
  <circle cx="280" cy="205" r="115" fill="url(#discGrad)" stroke="rgba(255,255,255,0.12)" stroke-width="2"/>
  <circle cx="280" cy="205" r="95" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1.5" stroke-dasharray="6 5"/>
  <circle cx="280" cy="205" r="75" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>

  <!-- Iconic 'P' Shape Geometry -->
  <!-- Vertical Stem of 'P' with Soundwave notches -->
  <rect x="115" y="90" width="56" height="332" rx="28" fill="url(#pAudioGrad)" filter="url(#pGlow)"/>

  <!-- Upper Loop / Bowl of 'P' -->
  <path d="M143 90h137c63.5 0 115 51.5 115 115s-51.5 115-115 115H143" 
        fill="none" 
        stroke="url(#pAudioGrad)" 
        stroke-width="56" 
        stroke-linecap="round" 
        filter="url(#pGlow)"/>

  <!-- Center Vinyl Label Disc / Play Button Housing -->
  <circle cx="280" cy="205" r="48" fill="#090d16" stroke="rgba(255,255,255,0.25)" stroke-width="2"/>
  <circle cx="280" cy="205" r="44" fill="url(#discGrad)"/>

  <!-- Dynamic Play Arrow inside the 'P' Disc -->
  <polygon points="270,183 270,227 304,205" fill="url(#pAudioGrad)"/>

  <!-- Equalizer Indicator Lines on 'P' Stem -->
  <line x1="143" y1="290" x2="143" y2="315" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.8"/>
  <line x1="143" y1="335" x2="143" y2="375" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.9"/>
  <line x1="143" y1="395" x2="143" y2="402" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.7"/>
</svg>
