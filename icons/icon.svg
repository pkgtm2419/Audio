<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1322"/>
      <stop offset="100%" stop-color="#05070c"/>
    </linearGradient>

    <!-- Neon Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>

    <!-- Disc Sheen Gradient -->
    <radialGradient id="discSheen" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="60%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>

    <!-- Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Base Rounded Container -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="510" height="510" x="1" y="1" rx="111" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>

  <!-- Outer Ambient Glow Ring -->
  <circle cx="256" cy="256" r="185" fill="none" stroke="url(#accentGrad)" stroke-width="3" opacity="0.3" filter="url(#neonGlow)"/>

  <!-- Vinyl Record Body -->
  <circle cx="256" cy="256" r="176" fill="url(#discSheen)" stroke="rgba(255,255,255,0.12)" stroke-width="2"/>

  <!-- Concentric Vinyl Grooves -->
  <circle cx="256" cy="256" r="156" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1.5" stroke-dasharray="8 6"/>
  <circle cx="256" cy="256" r="136" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>
  <circle cx="256" cy="256" r="116" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1.5" stroke-dasharray="12 8"/>
  <circle cx="256" cy="256" r="96" fill="none" stroke="rgba(255,255,255,0.07)" stroke-width="1.5"/>

  <!-- Center Vinyl Label Disc -->
  <circle cx="256" cy="256" r="74" fill="url(#accentGrad)" filter="url(#neonGlow)"/>
  <circle cx="256" cy="256" r="72" fill="#090d16" stroke="rgba(255,255,255,0.2)" stroke-width="2"/>

  <!-- Center Music Note Symbol -->
  <path d="M246 190v94.8c-4.8-2.8-10.4-4.5-16.4-4.5-18.1 0-32.8 14.7-32.8 32.8s14.7 32.8 32.8 32.8 32.8-14.7 32.8-32.8V226h42v-36h-58.4z" fill="url(#accentGrad)"/>

  <!-- Center Spindle Hole -->
  <circle cx="256" cy="256" r="12" fill="#04060a" stroke="rgba(255,255,255,0.25)" stroke-width="2"/>
</svg>
