name: Update Audio Catalog & Deploy

on:
  push:
    branches:
      - main
    paths:
      - 'songs/**'
      - 'generate-catalog.cjs'

permissions:
  contents: write

jobs:
  update-catalog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Regenerate catalog
        run: node generate-catalog.cjs

      - name: Commit and push updated catalog
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add songs.json songs.js
          if git diff --staged --quiet; then
            echo "No catalog changes detected."
          else
            git commit -m "Auto-update audio catalog [skip ci]"
            git push origin main
          fi
